# Netlify: static Vite app + serverless contact API
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # PORT / MAIL_TO often collide with harmless literals or public UI text; omit if needed.
  # Prefer: scope MAIL_TO to Functions only; use VITE_PUBLIC_CONTACT_EMAIL for the public email in Build.
  SECRETS_SCAN_OMIT_KEYS = "PORT,MAIL_TO"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# POST /api/contact → Netlify Function (must be listed before the SPA fallback)
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true

# Client-side routing (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
