# Netlify: static Vite app + serverless contact API
# https://docs.netlify.com/configure-builds/file-based-configuration/
#
# Monorepo note: this site's "Base directory" must be set to "apps/marketing" in the
# Netlify site settings (Build & deploy). Netlify auto-detects the npm workspaces root
# and installs from the repo root, then runs this file's build.command scoped here.

[build]
  command = "npm run build --workspace=apps/marketing"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

  # --- Netlify Secrets Controller (build-time env; same as UI “Environment variables”) ---
  # Docs: https://docs.netlify.com/build/environment-variables/secrets-controller/#configure-secret-scanning
  #
  # Comma-separated env *names* whose values should not be searched for in repo + build output.
  # Use when a value is public (e.g. contact email) or matches harmless literals (e.g. PORT=8080 vs dev config).
  SECRETS_SCAN_OMIT_KEYS = "PORT,MAIL_TO,SMTP_PORT,MAIL_API_PORT, VITE_PUBLIC_CONTACT_EMAIL"

  # Optional: comma-separated paths (repo-relative; substrings or globs) excluded from scanning.
  # Uncomment only if you still get false positives after OMIT_KEYS.
  # SECRETS_SCAN_OMIT_PATHS = "vite.config.ts,server/index.mjs,lib/**"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# POST /api/contact → Netlify Function (must be listed before the SPA fallback)
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true

# Client-side routing (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
